name: PR gate (advisory)

# Dogfood the Jev PR gate: one forward pass per pull request produces a risk
# score, change classification, policy flags and a receipt. It is advisory:
# the step never blocks a merge. Add `--fail-on hold` once the gate has been
# calibrated against real merge outcomes.
#
# With no provider secret (e.g. a fork PR) the workflow runs `--stub`, which
# exercises the reducer, policy merge, receipt and CI wiring without a model
# call. The receipt records `provider=stub` so it cannot be mistaken for one.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s1-triage:
    name: S1 triage (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run S1 PR gate
        id: gate
        continue-on-error: true
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if [ -n "${TYPESAFE_API_KEY}${OPENROUTER_API_KEY}" ] || \
             { [ -n "${CLOUDFLARE_API_TOKEN}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; }; then
            echo "::notice::Running the gate against the configured Jev provider."
            bun run examples/08-pr-gate.ts --base "$BASE" --head "$HEAD" \
              --json-file pr-gate-receipt.json
          else
            echo "::notice::No S1 credentials; running the offline stub (provider=stub)."
            bun run examples/08-pr-gate.ts --base "$BASE" --head "$HEAD" --stub \
              --json-file pr-gate-receipt.json
          fi

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1-pr-gate-receipt
          path: pr-gate-receipt.json
          retention-days: 14
          if-no-files-found: warn
