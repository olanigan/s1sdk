name: Release

# Publishes s1sdk from a tag. Preferred path is npm trusted publishing (OIDC):
# no long-lived secret, and the tarball is signed with provenance.
#
# Setup once on npmjs.com -> package s1sdk -> Settings -> Trusted Publisher:
#   GitHub owner: olanigan   repository: s1sdk   workflow: release.yml
# If trusted publishing is not configured yet, set the NPM_TOKEN repo secret and
# the token fallback below is used instead.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only (no upload)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: Gate (typecheck + tests + build)
        run: bun run check

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package=$PKG tag=$TAG"
          test "$PKG" = "$TAG" || { echo "::error::tag $TAG does not match package.json $PKG"; exit 1; }

      - name: Pack (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --dry-run --access public

      - name: Publish with provenance
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
